<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الأداء الاستراتيجي 2026</title>
<meta name="description" content="لوحة الأداء الاستراتيجي للجمعية الفيصلية الخيرية النسوية 2026، مرتبطة مباشرة بملف Excel وتتحدث عند حفظه.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeaf5;--surface:#ffffff;--surface-2:#f8f5fb;--line:#e6e0ed;--ink:#221a2e;--ink-2:#4a4159;--muted:#6f6781;
  --pur:#603c7f;--pur-d:#3d2550;--pur-dd:#2a1838;--pur-l:#f1ebf7;--gold:#c8a84b;--gold-d:#977021;
  --ok:#2c7a54;--ok-bg:#e4f3eb;--ok-m:#3a9a6c;
  --warn:#8f6400;--warn-bg:#fcf1d4;--warn-m:#d9a21b;
  --bad:#b0392d;--bad-bg:#fbe6e2;--bad-m:#d4553f;
  --pp:#625b70;--pp-bg:#efedf2;--pp-m:#b4adc0;
  --na:#625b70;--na-bg:#efedf2;--na-m:#d6d2dc;
  --nd:#2f6f80;--nd-bg:#e3f1f4;--nd-m:#8cc3cf;
  --d-s:#7d52a8;--d-m:#b07d1a;--d-sh:#16a0a0;--d-l:#4a68d6;--d-t:#5a9e2c;
  --r:18px;--r-s:11px;
  --sh:0 1px 2px rgba(61,37,80,.06),0 8px 24px -12px rgba(61,37,80,.18);
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1124;overflow:hidden}
@font-face{font-family:'Sakkal';src:local('Sakkal Majalla'),local('SakkalMajalla');font-weight:400 600;size-adjust:128%}
@font-face{font-family:'Sakkal';src:local('Sakkal Majalla Bold'),local('SakkalMajalla-Bold'),local('Sakkal Majalla');font-weight:700 900;size-adjust:128%}
body{font-family:'Sakkal','Tajawal','Segoe UI','Noto Naskh Arabic',Tahoma,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#viewport{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(1200px 700px at 70% 0%,#3a2350 0%,#1b1124 70%)}
#stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;display:grid;grid-template-rows:112px 66px 1fr 46px;font-size:19px;line-height:1.55}

/* header */
.hd{position:relative;display:flex;align-items:center;gap:22px;padding:0 34px;background:linear-gradient(100deg,var(--pur-dd),var(--pur-d) 45%,var(--pur) 100%);color:#fff;border-bottom:4px solid var(--gold)}
.hd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px);pointer-events:none}
.hd img{height:78px;width:78px;object-fit:contain;flex:none;position:relative;z-index:1}
.hd-t{flex:1;min-width:0;position:relative;z-index:1}
.hd-t h1{margin:0;font-size:39px;font-weight:900;letter-spacing:0;line-height:1.1}
.hd-t h1 em{font-style:normal;color:var(--gold)}
.hd-t p{margin:6px 0 0;font-size:16px;color:#dcd0ea;font-weight:500}
.qseg{position:relative;z-index:1;display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:5px;gap:4px}
.qseg button{position:relative;border:0;background:transparent;color:#e9def5;border-radius:10px;padding:9px 18px;font-weight:700;font-size:17px;cursor:pointer;transition:color .3s}
.qseg button small{display:block;font-size:11px;font-weight:500;opacity:.75;line-height:1.1}
.qseg button[aria-pressed=true]{color:var(--pur-d)}
.qseg .qpill{position:absolute;top:5px;bottom:5px;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:all .45s var(--ease)}
.qseg button span,.qseg button small{position:relative;z-index:1}
.live{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px 8px 14px;min-width:380px}
.live-dot{width:14px;height:14px;border-radius:50%;background:#9a8fae;flex:none;position:relative}
.live[data-st=linked] .live-dot{background:#43d18a}
.live[data-st=linked] .live-dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #43d18a;animation:pulse 1.8s infinite}
.live[data-st=paused] .live-dot,.live[data-st=manual] .live-dot{background:var(--gold)}
.live[data-st=error] .live-dot{background:#ff7b6b}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.live-t{flex:1;min-width:0;line-height:1.25}
.live-t b{display:block;font-size:15px;font-weight:800}
.live-t span{display:block;font-size:12px;color:#d5c8e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.hbtn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s,transform .2s}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn:active{transform:scale(.97)}
.hbtn.gold{background:var(--gold);border-color:var(--gold);color:var(--pur-dd)}
.hbtn.gold:hover{background:#d8bb5f}

/* tabs */
.tabs{display:flex;align-items:center;gap:6px;padding:0 30px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.tab{position:relative;border:0;background:transparent;padding:0 13px;height:66px;font-size:16.5px;white-space:nowrap;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:10px;transition:color .25s}
.tab i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--pur-l);color:var(--pur);font-size:14px;transition:all .25s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--pur-d)}
.tab[aria-selected=true] i{background:var(--pur);color:#fff}
.tab-ink{position:absolute;bottom:-1px;height:4px;border-radius:4px 4px 0 0;background:var(--gold);transition:all .45s var(--ease)}
.tabs-sp{flex:1}
.tbtn{white-space:nowrap;border:1px solid var(--line);background:var(--surface-2);color:var(--pur-d);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center;transition:all .2s}
.tbtn:hover{border-color:var(--pur);background:var(--pur-l)}
.tbtn[aria-pressed=true]{background:var(--pur);color:#fff;border-color:var(--pur)}
.vis{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:700;color:var(--ink-2)}
.vis b{font-size:17px;font-weight:900;color:var(--pur-d);min-width:24px;text-align:center}
.vis .vsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.vis.off b{color:var(--muted)}

/* screens */
#screens{position:relative;overflow:hidden}
.screen{position:absolute;inset:0;padding:24px 30px;display:none}
.screen.on{display:block;animation:scrIn .55s var(--ease) both}
@keyframes scrIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px 24px;position:relative;min-width:0;min-height:0}
.card h3{margin:0 0 4px;font-size:20px;font-weight:800;color:var(--pur-d);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card h3 .sub{font-size:13px;font-weight:500;color:var(--muted)}
.rise{animation:rise .6s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* overview */
.ov{display:grid;height:100%;gap:20px;grid-template-columns:430px 1fr 1fr;grid-template-rows:344px 1fr}
.ov .c-gauge{grid-row:1}
.ov .c-dims{grid-column:1/3;grid-row:2}
.ov .c-trend{grid-column:3;grid-row:2}
.gauge-wrap{display:flex;flex-direction:column;align-items:center;margin-top:2px}
.gauge{width:340px;height:190px;display:block}
.gauge .g-tr{stroke:#ece6f2}
.gauge .g-val{transition:stroke-dashoffset 1.4s var(--ease),stroke .4s}
.g-big{margin-top:-96px;font-size:71px;font-weight:900;line-height:1;color:var(--ink)}
.g-big small{font-size:31px;color:var(--muted);font-weight:700}
.g-meta{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;justify-content:center}
.g-src{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-pp{background:var(--pp-bg);color:var(--pp)}.p-na{background:var(--na-bg);color:var(--na)}.p-nd{background:var(--nd-bg);color:var(--nd)}
.dl{font-weight:800;font-size:15px;white-space:nowrap}
.dl.up{color:var(--ok)}.dl.dn{color:var(--bad)}.dl.eq{color:var(--muted)}
.stack{display:flex;gap:3px;height:34px;margin:16px 0 18px;border-radius:9px;overflow:hidden}
.stack span{display:block;height:100%;min-width:6px;transition:flex-grow 1.1s var(--ease);cursor:pointer;position:relative}
.stack span:hover{filter:brightness(1.08) saturate(1.1)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface-2);text-align:right;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:#cfc3dc}
.tile .tv{grid-row:1/3;font-size:43px;font-weight:900;line-height:1}
.tile .tl{font-size:15px;font-weight:700;color:var(--ink-2)}
.tile .ti{font-size:12px;color:var(--muted)}
.tile.t-ok .tv{color:var(--ok)}.tile.t-warn .tv{color:var(--warn)}.tile.t-bad .tv{color:var(--bad)}.tile.t-pp .tv{color:var(--pp)}.tile.t-nd .tv{color:var(--nd)}.tile.t-na .tv{color:var(--na)}
.tot{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.tot b{font-size:47px;font-weight:900;color:var(--pur-d);line-height:1}
.tot span{color:var(--muted);font-size:16px}

.hb{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.hb-row{display:grid;grid-template-columns:230px 1fr 170px;gap:18px;align-items:center;cursor:pointer;border-radius:12px;padding:6px 10px;margin-inline:-10px;transition:background .2s}
.hb-row:hover{background:var(--surface-2)}
.hb-l{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.hb-l i{width:14px;height:14px;border-radius:4px;flex:none}
.hb-l small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.hb-track{position:relative;height:26px;background:#f0ecf4;border-radius:7px}
.hb-fill{position:absolute;top:0;bottom:0;right:0;border-radius:7px 4px 4px 7px;width:0;transition:width 1.2s var(--ease)}
.hb-tgt{position:absolute;top:-5px;bottom:-5px;left:0;width:2px;background:var(--ink-2);opacity:.5}
.hb-v{display:flex;align-items:center;gap:10px;justify-content:flex-start}
.hb-v b{font-size:23px;font-weight:900;min-width:76px}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-2);transition:all .2s}
.lg i{width:18px;height:4px;border-radius:2px}
.lg[aria-pressed=false]{opacity:.45}
.lg[aria-pressed=false] i{background:#bbb!important}
svg text{font-family:inherit}
.ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ln.main{stroke-width:4}
.ln-draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.4s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pt{transition:r .2s}
.pt-in{opacity:0;animation:fadeIn .4s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.ax{fill:var(--muted);font-size:14px}
.ax-b{fill:var(--ink-2);font-size:15px;font-weight:700}
.grid-l{stroke:#ece6f2;stroke-width:1}
.cross{stroke:var(--pur);stroke-width:1.5;stroke-dasharray:4 4;opacity:0;transition:opacity .15s}

/* dims & goals */
.an2{display:grid;grid-template-columns:600px 1fr;gap:18px;height:100%}
.an2-l{display:grid;grid-template-rows:auto 1fr;gap:18px;min-height:0}
.cum{display:grid;grid-template-columns:1fr;gap:6px}
.cum-top{display:flex;align-items:center;gap:20px}
.cum .big{font-size:75px;font-weight:900;line-height:1;color:var(--ink)}
.cum .big small{font-size:31px;color:var(--muted)}
.cum .how{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.qcols{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:end;height:215px;position:relative;margin-top:8px;padding:0 10px}
.qcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;cursor:pointer}
.qcol .bar{width:100%;border-radius:10px 10px 4px 4px;height:0;transition:height 1.2s var(--ease);position:relative}
.qcol .bar.empty{background:repeating-linear-gradient(135deg,#efeaf4 0 6px,#f8f5fb 6px 12px);border:1px dashed #cfc5da}
.qcol b{font-size:18px;font-weight:900}
.qcol span{font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.qcol.cur span{color:var(--pur)}
.cumline{position:absolute;left:0;right:0;border-top:2.5px dashed var(--gold-d);pointer-events:none;transition:bottom 1.2s var(--ease)}
.cumline em{position:absolute;left:0;top:-24px;font-style:normal;font-size:12px;font-weight:800;color:var(--gold-d);background:var(--surface);padding:0 6px;border-radius:6px}
table.mx{width:100%;border-collapse:separate;border-spacing:4px;font-size:14px;table-layout:fixed}
.mx th{font-size:13px;color:var(--muted);font-weight:800;padding:2px 6px;text-align:center}
.mx th:first-child{text-align:right}
.mx td{border-radius:8px;text-align:center;padding:5px 4px;font-weight:800;font-variant-numeric:tabular-nums}
.mx td.lbl{text-align:right;background:none;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2px}
.mx td.lbl b{color:var(--c);margin-left:6px}
.mx td.cumc{background:var(--pur-d)!important;color:#fff}
.mx td.cumc.na{background:#cfc8d8!important}
.mx tr.clk{cursor:pointer}
.mx tr.clk:hover td.lbl{color:var(--pur)}
.mx td small{display:block;font-size:11px;font-weight:600;opacity:.8}
.mx .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;vertical-align:middle}
.krd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.smap{display:grid;grid-template-rows:auto auto 1fr;gap:12px;height:100%}
.sm-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.sm-h h2{margin:0;font-size:27px;font-weight:900;color:var(--pur-d)}
.sm-h h2 span{color:var(--gold-d)}
.sm-h p{margin:0;color:var(--muted);font-size:14px}
.sm-lg{display:flex;gap:8px;flex-wrap:wrap}
.idn{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.idc{border-radius:16px;padding:10px 18px;color:#fff;text-align:center;box-shadow:var(--sh);position:relative;overflow:hidden;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.idc::after{content:"";position:absolute;inset:0;background:radial-gradient(240px 120px at 15% 0%,rgba(255,255,255,.22),transparent 70%);pointer-events:none}
.idc b{display:block;font-size:17px;font-weight:900;margin-bottom:4px;opacity:.95}
.idc span{font-size:14.5px;font-weight:500;line-height:1.55}
.id-v{background:linear-gradient(120deg,#3d2550,#6b4590)}
.id-m{background:linear-gradient(120deg,#1d5a86,#2f86b8)}
.id-c{background:linear-gradient(120deg,#6f5212,#a8862f)}
.id-t{background:linear-gradient(120deg,#1f7a4b,#3a9a6c)}
.smc{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;min-height:0}
.smcol{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;scrollbar-width:none}
.smhd{border-radius:12px;color:#fff;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .25s var(--ease)}
.smhd:hover{transform:translateY(-2px)}
.smhd em{font-style:normal;background:rgba(255,255,255,.2);border-radius:8px;padding:0 10px;font-size:16px}
.smg{border-radius:13px;border:1.5px solid;padding:8px 12px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s;display:flex;flex-direction:column;gap:6px}
.smg:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.smg .top{display:flex;align-items:flex-start;gap:8px}
.smg .n{font-weight:800;font-size:14.5px;line-height:1.35;flex:1}
.smg .row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.smg .n b{color:var(--pur);margin-left:4px}
.smg .tr{height:7px;border-radius:4px;background:rgba(0,0,0,.07);position:relative;overflow:hidden}
.smg .tr span{position:absolute;top:0;bottom:0;right:0;border-radius:4px;width:0;transition:width 1.1s var(--ease)}
.smg .ft{display:flex;align-items:center;justify-content:space-between;gap:8px}
.smg .ft b{font-size:16px;font-weight:900}
.smg .qd{display:flex;gap:4px;flex:none;padding-top:4px}
.smg .qd i{width:12px;height:12px;border-radius:50%;display:block;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.smg .qd i.cur{box-shadow:0 0 0 2px var(--ink)}
.smg .pill{font-size:12px;padding:1px 10px}
.g-ok{background:#f1faf5;border-color:#bfe3cf}.g-warn{background:#fffaeb;border-color:#efd99a}.g-bad{background:#fdf2f0;border-color:#f0c2b9}.g-pp,.g-na{background:#f6f5f8;border-color:#dedae4}.g-nd{background:#f0f7f9;border-color:#c6e1e8}
.dg{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;height:100%}
.dcol{display:flex;flex-direction:column;gap:12px;min-height:0}
.dhead{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform .25s var(--ease)}
.dhead:hover{transform:translateY(-3px)}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px}
.ring circle.v{transition:stroke-dashoffset 1.3s var(--ease)}
.dhead h4{margin:0;font-size:21px;font-weight:900;color:var(--ink)}
.dhead .dc{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dhead .dc span{font-size:12px;font-weight:800;border-radius:7px;padding:1px 8px}
.goals{display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 2px 6px;min-height:0;scrollbar-width:thin}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;border-right:5px solid var(--c)}
.gcard:hover{transform:translateX(-4px);box-shadow:var(--sh);border-color:#cfc3dc}
.gcard .gt{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.gcard .gn{font-weight:800;font-size:16px;line-height:1.35}
.gcard .gn b{color:var(--c);margin-left:6px}
.gcard .gv{font-weight:900;font-size:21px;white-space:nowrap}
.qbars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;align-items:end;height:46px}
.qb{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.qb span{display:block;border-radius:5px 5px 2px 2px;height:0;transition:height 1s var(--ease)}
.qb.cur::after{content:"";position:absolute;bottom:-6px;right:30%;left:30%;height:3px;border-radius:2px;background:var(--ink)}
.qb em{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--muted)}

/* KPI table */
.kp{display:grid;grid-template-rows:auto 1fr;gap:16px;height:100%}
.fbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{position:relative}
.search input{width:330px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--pur);box-shadow:0 0 0 4px rgba(96,60,127,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center;transition:all .2s}
.chip i{width:10px;height:10px;border-radius:3px}
.chip:hover{border-color:#cfc3dc}
.chip[aria-pressed=true]{background:var(--pur-d);border-color:var(--pur-d);color:#fff}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;max-width:330px}
.fsep{width:1px;height:30px;background:var(--line)}
.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;min-height:0;scrollbar-width:thin}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.t th{position:sticky;top:0;z-index:2;background:var(--pur-d);color:#fff;font-weight:800;text-align:right;padding:12px 12px;white-space:nowrap;font-size:14px}
.t th button{all:unset;cursor:pointer}
.t td{padding:10px 12px;border-bottom:1px solid #f0ebf5;vertical-align:middle}
.t tbody tr{cursor:pointer;transition:background .15s}
.t tbody tr:hover{background:var(--pur-l)}
.t tbody tr.in{animation:rowIn .45s var(--ease) both}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.code{font-weight:900;color:var(--pur);white-space:nowrap}
.pbar{display:flex;align-items:center;gap:10px;min-width:170px}
.pbar .tr{flex:1;height:10px;border-radius:5px;background:#f0ecf4;position:relative;overflow:hidden}
.pbar .tr span{position:absolute;top:0;bottom:0;right:0;border-radius:5px;width:0;transition:width 1s var(--ease)}
.pbar b{min-width:58px;font-weight:900}
.dtag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap}
.dtag i{width:10px;height:10px;border-radius:3px}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:17px}

/* departments */
.dp{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;height:100%}
.dp .card{display:flex;flex-direction:column;min-height:0}
.dlist{overflow:auto;min-height:0;margin-top:10px;scrollbar-width:thin}
.drow{display:grid;grid-template-columns:330px 1fr 92px;gap:14px;align-items:center;padding:9px 12px;border-radius:12px;cursor:pointer;transition:background .2s}
.drow:hover{background:var(--surface-2)}
.drow[aria-pressed=true]{background:var(--pur-l);box-shadow:inset -4px 0 0 var(--pur)}
.drow .dn{font-weight:800;font-size:16px;line-height:1.3}
.drow .dn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.drow b{font-size:20px;font-weight:900}
.klist{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px;margin-top:12px;scrollbar-width:thin}
.krow{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .2s}
.krow:hover{border-color:var(--pur);background:var(--pur-l)}
.krow .kn{font-weight:700;font-size:15px;line-height:1.35}
.krow .kn small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.krow .kv{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.krow .kv b{font-size:18px;font-weight:900}

/* analysis */
.an{display:grid;grid-template-columns:420px 1fr;gap:20px;height:100%}
.an .card{min-height:0;display:flex;flex-direction:column}
.glist{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px;margin-top:10px;scrollbar-width:thin}
.gli{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:1px solid transparent;border-radius:12px;padding:9px 10px;cursor:pointer;text-align:right;background:none;transition:all .2s}
.gli:hover{background:var(--surface-2)}
.gli[aria-pressed=true]{background:var(--pur-l);border-color:#d9cbe7}
.gli b{color:var(--c);font-weight:900}
.gli span{font-weight:700;font-size:15px;line-height:1.35}
.gli em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:1px 8px}
.atabs{display:flex;gap:6px;margin:12px 0 14px;border-bottom:1px solid var(--line)}
.atab{border:0;background:none;padding:10px 18px;font-weight:800;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.atab[aria-selected=true]{color:var(--pur-d);border-color:var(--gold)}
.atext{overflow:auto;min-height:0;padding-left:8px;scrollbar-width:thin}
.ablock{border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px;animation:rise .5s var(--ease) both}
.ablock h5{margin:0 0 8px;font-size:14px;color:var(--pur);font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ablock p{margin:0 0 6px;font-size:16px;line-height:1.75;white-space:pre-line}
.ablock ul{margin:0;padding-right:20px}
.ablock li{font-size:16px;line-height:1.7;margin-bottom:4px}

/* initiatives */
.in-g{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:14px;height:100%}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;overflow:hidden;position:relative}
.icard::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--pur))}
.icard:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:#cfc3dc}
.icard h4{margin:4px 0 0;font-size:16px;font-weight:800;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.icard .io{font-size:12px;color:var(--muted);font-weight:700}
.icard .idsc{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.icard .ig{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.icard .ig span{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--pur-l);color:var(--pur)}

/* panel */
#scrim{position:absolute;inset:0;background:rgba(34,26,46,.35);opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:absolute;top:0;bottom:0;left:0;width:700px;background:var(--surface);z-index:41;box-shadow:20px 0 60px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .5s var(--ease);display:flex;flex-direction:column}
#panel.on{transform:none}
.ph{background:var(--pur-d);color:#fff;padding:22px 26px;display:flex;gap:16px;align-items:flex-start}
.ph h2{margin:0;font-size:24px;font-weight:900;line-height:1.35;flex:1}
.ph .pc{display:inline-block;background:var(--gold);color:var(--pur-dd);font-weight:900;border-radius:8px;padding:0 10px;font-size:15px;margin-bottom:6px}
.ph button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;width:44px;height:44px;border-radius:12px;font-size:21px;cursor:pointer;flex:none}
.pb{padding:22px 26px;overflow:auto;flex:1;scrollbar-width:thin}
.pb h4{margin:20px 0 10px;font-size:17px;color:var(--pur-d);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{border:1px solid var(--line);border-radius:9px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.q4 div{border-radius:14px;padding:12px;text-align:center;border:1px solid var(--line);cursor:default}
.q4 div.cur{outline:3px solid var(--gold);outline-offset:1px}
.q4 b{display:block;font-size:25px;font-weight:900;line-height:1.2}
.q4 small{display:block;font-size:12px;color:var(--ink-2);font-weight:700}
.q4 em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px}
.c-ok{background:var(--ok-bg)}.c-warn{background:var(--warn-bg)}.c-bad{background:var(--bad-bg)}.c-pp{background:var(--pp-bg)}.c-na{background:var(--na-bg)}.c-nd{background:var(--nd-bg)}
.txt{font-size:16px;line-height:1.8;white-space:pre-line;margin:0}

/* footer */
.ft{display:flex;align-items:center;gap:18px;padding:0 30px;background:var(--surface);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.ft b{color:var(--ink-2)}
.ft .sp{flex:1}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:11px;background:var(--surface-2);color:var(--ink-2)}

/* tooltip & toast */
.tip{position:fixed;z-index:100;pointer-events:none;background:var(--pur-dd);color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:380px;font-family:'Sakkal','Tajawal',Tahoma,sans-serif;direction:rtl}
.tip.on{opacity:1;transform:none}
.tip b{color:var(--gold)}
.tip .tr{display:flex;gap:10px;justify-content:space-between;align-items:center}
.tip i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;box-shadow:0 0 0 1.5px rgba(255,255,255,.7)}
#toast{position:absolute;bottom:64px;left:50%;transform:translate(-50%,30px);background:var(--pur-dd);color:#fff;border-radius:14px;padding:12px 22px;font-size:16px;font-weight:700;box-shadow:0 12px 34px rgba(0,0,0,.3);opacity:0;transition:all .4s var(--ease);z-index:60;display:flex;gap:10px;align-items:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#7a2219}
.flash{animation:flash 2.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--gold),0 0 30px rgba(200,168,75,.6)}100%{box-shadow:var(--sh)}}
tr.flash td{animation:flashBg 2.4s ease}
@keyframes flashBg{0%,40%{background:#fbf1cf}100%{background:transparent}}
.drop{position:absolute;inset:0;z-index:90;background:rgba(61,37,80,.85);display:none;place-items:center;color:#fff;font-size:33px;font-weight:900;border:6px dashed var(--gold)}
.drop.on{display:grid}
.pop{position:absolute;top:104px;left:150px;width:520px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:50;padding:18px 20px;display:none;color:var(--ink)}
.pop.on{display:block;animation:rise .3s var(--ease)}
.pop h4{margin:0 0 6px;font-size:17px;color:var(--pur-d)}
.pop p{margin:0 0 10px;font-size:14px;color:var(--ink-2);line-height:1.6}
.pop .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pop .tbtn{font-size:13px}
.log{max-height:230px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.log div{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}
.log time{font-weight:800;color:var(--pur);margin-left:8px}

:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@page{size:1920px 1080px;margin:0}
@media print{html,body{overflow:visible;background:#fff}#viewport{position:static;background:none}#stage{transform:none!important;position:relative;box-shadow:none}.tabs .tbtn,.hbtn,#toast,.tip{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

function detectQ(name){var n=String(name||'').replace(/(19|20)\d\d/g,' ');var P=[[/الأول|الاول/,'q1'],[/الثاني/,'q2'],[/الثالث/,'q3'],[/الرابع/,'q4']];for(var i=0;i<P.length;i++)if(P[i][0].test(n))return P[i][1];var m=n.match(/(?:^|\D)([1-4])(?:\D|$)/);return m?'q'+m[1]:null;}
function parseWorkbook(buf){
  var wb=XLSX.read(buf,{type:'array',cellDates:false});
  var out={quarters:{},warnings:[]};
  wb.SheetNames.forEach(function(sn){
    var qid=detectQ(sn);if(!qid){out.warnings.push('تُجوهلت الورقة «'+sn+'» لتعذّر تحديد الربع من اسمها');return;}
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null,blankrows:true});
    var hi=-1;for(var i=0;i<Math.min(10,rows.length);i++){if((rows[i]||[]).some(function(c){return clean(c)==='رمز المؤشر';})){hi=i;break;}}
    if(hi<0){out.warnings.push('الورقة «'+sn+'»: لا يوجد عمود «رمز المؤشر»');return;}
    var H=rows[hi].map(clean),idx={};
    Object.keys(COLS).forEach(function(k){idx[k]=-1;for(var j=0;j<COLS[k].length;j++){var p=H.indexOf(COLS[k][j]);if(p>-1){idx[k]=p;break;}}});
    var kpis=[],seen={};
    for(var r=hi+1;r<rows.length;r++){var row=rows[r]||[];
      var g=function(k){return idx[k]>-1?row[idx[k]]:null;};
      var code=clean(g('code'));if(!/^[^\d\s]+\d+-\d+$/.test(code))continue;
      if(seen[code]){out.warnings.push(QDEF.find(function(q){return q.id===qid;}).name+': رمز مكرر '+code);continue;}seen[code]=1;
      var tg=num(g('target')),ac=num(g('actual')),p=num(g('perf'));
      if(Number.isNaN(tg))tg=null;if(Number.isNaN(ac))ac=null;if(Number.isNaN(p))p=null;
      if(p!=null&&p>1.5&&p<=150)p=p/100;
      var res=clean(g('kpiRes')),stt=clean(g('status'));
      if(!res&&stt==='مؤجل')res='مؤجل';
      if(res==='مؤجل'||p==null){if(tg===0)tg=null;if(ac===0&&p==null)ac=null;}
      kpis.push({c:code,n:clean(g('name')),d:dimOfCode(code),goal:clean(g('goal')),ow:clean(g('owner')),pr:clean(g('period')),tg:rnd(tg),ac:rnd(ac),p:rnd(p),r:res||(p==null?'لا توجد بيانات':''),an:clean(g('an')),rc:clean(g('rc')),st:clean(g('st'))});
    }
    var goals=[],gi=-1;
    for(var a=0;a<rows.length;a++){if((rows[a]||[]).some(function(c){return clean(c)==='رمز الهدف';})){gi=a;break;}}
    if(gi>-1){var c0=rows[gi].map(clean).indexOf('رمز الهدف');
      for(var b=gi+1;b<rows.length;b++){var rr=rows[b]||[];var gc=clean(rr[c0]);if(!/^[^\d\s]+\d+$/.test(gc))continue;var gp=num(rr[c0+2]);if(Number.isNaN(gp))gp=null;if(gp!=null&&gp>1.5&&gp<=150)gp=gp/100;var gr=clean(rr[c0+3]);
        goals.push({c:gc,n:clean(rr[c0+1]),d:dimOfCode(gc),p:rnd(gp),r:gr||(gp==null?'لا توجد بيانات':'')});}}
    if(!goals.length){ // fall back to goal columns on the KPI rows
      var gm={};kpis.forEach(function(k){var gc=goalOfCode(k.c);if(gc&&!gm[gc]){gm[gc]={c:gc,n:k.goal,d:k.d,p:null,r:'لا توجد بيانات'};goals.push(gm[gc]);}});}
    var dims={},overall=null,di=-1;
    for(var d=0;d<rows.length;d++){if((rows[d]||[]).some(function(c){return clean(c)==='الأبعاد';})){di=d;break;}}
    if(di>-1){var hd=rows[di].map(clean),cn=hd.indexOf('الأبعاد'),cp=-1;for(var x=0;x<hd.length;x++){if(hd[x].indexOf('الأداء')===0){cp=x;break;}}
      if(cp>-1)for(var y=di+1;y<Math.min(rows.length,di+7);y++){var rw=rows[y]||[];var dk=NAME_DIM[clean(rw[cn])];var v=num(rw[cp]);if(dk&&typeof v==='number'&&!Number.isNaN(v))dims[dk]=rnd(v);}}
    for(var z=0;z<rows.length;z++){var rz=(rows[z]||[]),cz=rz.map(clean),ix=cz.indexOf('متوسط أداء الربع');if(ix>-1){for(var w=ix+1;w<rz.length;w++){var vv=num(rz[w]);if(typeof vv==='number'&&!Number.isNaN(vv)){overall=rnd(vv);break;}}break;}}
    if(!kpis.length){out.warnings.push('الورقة «'+sn+'»: لا توجد مؤشرات صالحة');return;}
    out.quarters[qid]={kpis:kpis,goals:goals,dims:dims,overall:overall};
  });
  if(!Object.keys(out.quarters).length)throw new Error('لم يُعثر على أوراق أرباع صالحة في الملف');
  return out;
}

var DATA=null,SRC={kind:'embedded',name:EMBED_NAME,at:null},CHANGED={},LOG=[];
function buildModel(parsed){
  var Q=QDEF.map(function(def,i){var raw=parsed.quarters[def.id]||{kpis:[],goals:[],dims:{},overall:null};
    var q={id:def.id,idx:i,name:def.name,short:def.short,months:def.months,end:def.end,kpis:raw.kpis.slice().sort(function(a,b){return cmpCode(a.c,b.c);}),goals:raw.goals.slice().sort(function(a,b){return cmpCode(a.c,b.c);}),offDims:raw.dims||{},offOverall:raw.overall,present:!!parsed.quarters[def.id]};
    q.kmap={};q.kpis.forEach(function(k){q.kmap[k.c]=k;});q.gmap={};q.goals.forEach(function(g){q.gmap[g.c]=g;});return q;});
  var goals={};Q.forEach(function(q){q.goals.forEach(function(g){if(!goals[g.c]||(!goals[g.c].n&&g.n))goals[g.c]={c:g.c,n:g.n,d:g.d};});q.kpis.forEach(function(k){var gc=goalOfCode(k.c);if(gc&&!goals[gc])goals[gc]={c:gc,n:k.goal,d:k.d};});});
  var kall={};Q.forEach(function(q){q.kpis.forEach(function(k){kall[k.c]={c:k.c,n:k.n,d:k.d,ow:k.ow||(kall[k.c]&&kall[k.c].ow)||'',pr:k.pr};});});
  return {Q:Q,GOALS:Object.keys(goals).sort(cmpCode).map(function(c){return goals[c];}),KALL:Object.keys(kall).sort(cmpCode).map(function(c){return kall[c];}),warnings:parsed.warnings};
}
function qEnded(q){return TODAY>new Date(q.end+'T23:59:59');}
function kstat(k,q){if(!k)return 'na';if(k.r==='مؤجل')return 'pp';if(k.p==null)return qEnded(q)?'na':'nd';if(k.r==='تحقق')return 'ok';if(k.r==='مقبول')return 'warn';if(k.r==='ضعيف'||k.r==='خطر')return 'bad';return perfClass(k.p);}
function gstat(g,q){if(!g)return qEnded(q)?'na':'nd';if(g.r==='مؤجل')return 'pp';if(g.p==null)return qEnded(q)?'na':'nd';if(g.r==='تحقق')return 'ok';if(g.r==='مقبول')return 'warn';if(g.r==='ضعيف'||g.r==='خطر')return 'bad';return perfClass(g.p);}
function measured(list,q){return list.filter(function(k){var s=kstat(k,q);return s==='ok'||s==='warn'||s==='bad';});}
function avg(list){if(!list.length)return null;return list.reduce(function(s,k){return s+(+k.p);},0)/list.length;}
function qPerf(q){if(q.offOverall!=null)return {v:q.offOverall,src:'off',n:measured(q.kpis,q).length};var m=measured(q.kpis,q);return {v:avg(m),src:'calc',n:m.length};}
function dPerf(q,dk){if(q.offDims[dk]!=null)return {v:q.offDims[dk],src:'off'};var m=measured(q.kpis.filter(function(k){return k.d===dk;}),q);return {v:avg(m),src:'calc',n:m.length};}
function prevQ(q){return q.idx>0?DATA.Q[q.idx-1]:null;}
function kPerfVal(k,q){var s=kstat(k,q);return (s==='ok'||s==='warn'||s==='bad')?+k.p:null;}
function gPerfVal(g,q){var s=gstat(g,q);return (s==='ok'||s==='warn'||s==='bad')?+g.p:null;}
function qDelta(q){var p=prevQ(q);if(!p)return null;var a=qPerf(q).v,b=qPerf(p).v;return a==null||b==null?null:a-b;}
function kDelta(c,q){var p=prevQ(q);if(!p)return null;var a=kPerfVal(q.kmap[c],q),b=kPerfVal(p.kmap[c],p);return a==null||b==null?null:a-b;}
function goalName(gc){var g=DATA.GOALS.find(function(x){return x.c===gc;});return g?g.n:'';}
function ownerOf(c){var k=DATA.KALL.find(function(x){return x.c===c;});return k&&k.ow?k.ow:'';}
function counts(list,fn,q){var c={};list.forEach(function(x){var s=fn(x,q);c[s]=(c[s]||0)+1;});return c;}

/* ════════ animation helpers ════════ */
function countUp(root){(root||document).querySelectorAll('[data-count]').forEach(function(el){var to=+el.getAttribute('data-count'),dec=+(el.getAttribute('data-dec')||0),suf=el.getAttribute('data-suf')||'';var t0=null,dur=1100;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to.toFixed(dec)+suf;return;}
  function step(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=(to*e).toFixed(dec)+suf;if(k<1)requestAnimationFrame(step);}requestAnimationFrame(step);});}
function grow(root){requestAnimationFrame(function(){requestAnimationFrame(function(){(root||document).querySelectorAll('[data-w]').forEach(function(el){el.style.width=el.getAttribute('data-w');});(root||document).querySelectorAll('[data-h]').forEach(function(el){el.style.height=el.getAttribute('data-h');});(root||document).querySelectorAll('[data-flex]').forEach(function(el){el.style.flexGrow=el.getAttribute('data-flex');});(root||document).querySelectorAll('[data-off]').forEach(function(el){el.style.strokeDashoffset=el.getAttribute('data-off');});});});}

function gaugeSVG(v){var R=150,cx=170,cy=170,len=Math.PI*R;var val=v==null?0:Math.max(0,Math.min(1,v));var col=v==null?'#cfc8d8':statusVar(perfClass(v));

function go(screen){if(screen===STATE.screen)return;STATE.screen=screen;saveUI();render();}

  tr.querySelectorAll('[data-xhair]').forEach(function(r){r.addEventListener('mouseenter',function(){var x=+r.getAttribute('x')+60;xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.style.opacity=1;});r.addEventListener('mouseleave',function(){xh.style.opacity=0;});});}}
document.addEventListener('click',function(e){var t=e.target;
  var el;
  if((el=t.closest('[data-q]'))&&(el.closest('#qseg')||el.closest('#trend')||el.classList.contains('qcol'))){setQ(el.getAttribute('data-q'));return;}
  if((el=t.closest('[data-screen]'))){stopAuto();go(el.getAttribute('data-screen'));return;}
  if(t.closest('#panel')&&!t.closest('[data-kpi],[data-goal],[data-agoal-go]')&&!t.closest('#p-x'))return;
  if((el=t.closest('[data-kpi]'))){openKPI(el.getAttribute('data-kpi'));return;}

  if((el=t.closest('[data-godim]'))){stopAuto();STATE.kDim=el.getAttribute('data-godim');STATE.kStat='all';STATE.screen='kpis';saveUI();render();return;}
  if((el=t.closest('[data-trend]'))){var k=el.getAttribute('data-trend');STATE.trendOn[k]=!STATE.trendOn[k];el.setAttribute('aria-pressed',String(STATE.trendOn[k]));var tr=$('trend');if(tr){tr.innerHTML=trendSVG();wireScreen($('screens'));}return;}

  if((el=t.closest('[data-kstat]'))){STATE.kStat=el.getAttribute('data-kstat');render({still:true});return;}
  if((el=t.closest('[data-kreset]'))){STATE.kDim='all';STATE.kStat='all';STATE.kOwner='all';STATE.kSearch='';render({still:true});return;}

  if((el=t.closest('[data-dept]'))){STATE.dept=el.getAttribute('data-dept');render({still:true,keep:true});return;}
  if((el=t.closest('[data-agoal]'))){STATE.goal=el.getAttribute('data-agoal');render({still:true,keep:true});return;}
  if((el=t.closest('[data-atab]'))){STATE.atab=el.getAttribute('data-atab');render({still:true,keep:true});return;}
});

function idbGet(k){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction('kv','readonly'),r=tx.objectStore('kv').get(k);r.onsuccess=function(){res(r.result);};r.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbDel(k){return idb().then(function(db){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);}).catch(function(){});}
function setLive(st,h,s){LIVE.state=st;$('live').setAttribute('data-st',st);$('live-h').textContent=h;$('live-s').textContent=s;$('live-s').title=s;
  $('btn-link').textContent=st==='linked'?'تغيير الملف':st==='paused'?'استئناف المراقبة':'ربط ملف Excel';if(st==='paused')$('btn-link').classList.add('gold');}
function diffData(oldD,newD){var ch={},n=0,lines=[];if(!oldD)return {ch:ch,n:0,lines:lines};
  newD.Q.forEach(function(q){var o=oldD.Q.find(function(x){return x.id===q.id;});if(!o)return;
    if(qPerf(o).v!==qPerf(q).v){ch[q.id+'|overall']=1;n++;lines.push(q.name+': الأداء العام '+fmtP(qPerf(o).v)+' ← '+fmtP(qPerf(q).v));}
    DIMS.forEach(function(d){if(dPerf(o,d.k).v!==dPerf(q,d.k).v){ch[q.id+'|dim|'+d.k]=1;n++;lines.push(q.name+': بعد '+d.n+' '+fmtP(dPerf(o,d.k).v)+' ← '+fmtP(dPerf(q,d.k).v));}});
    q.kpis.forEach(function(k){var ok=o.kmap[k.c];if(!ok||ok.p!==k.p||ok.r!==k.r||ok.ac!==k.ac||ok.tg!==k.tg||ok.an!==k.an||ok.rc!==k.rc){ch[q.id+'|kpi|'+k.c]=1;n++;lines.push(q.name+': المؤشر '+k.c+(ok&&ok.p!==k.p?' '+fmtP(ok.p)+' ← '+fmtP(k.p):ok?' (تعديل في القيم أو النصوص)':' (جديد)'));}});
    q.goals.forEach(function(g){var og=o.gmap[g.c];if(!og||og.p!==g.p||og.r!==g.r){ch[q.id+'|goal|'+g.c]=1;n++;lines.push(q.name+': الهدف '+g.c+' '+fmtP(og&&og.p)+' ← '+fmtP(g.p));}});});
  return {ch:ch,n:n,lines:lines};}
function applyParsed(parsed,src,announce){var nd=buildModel(parsed);var df=diffData(DATA,nd);var first=!DATA;DATA=nd;SRC=src;CHANGED=df.ch;
  if(first||!DATA.Q.some(function(q){return q.id===STATE.q;}))STATE.q=defaultQ();
  render({still:!first,keep:!first});
  if(announce){var msg=df.n?'⟳ تحدّثت اللوحة من Excel: '+nn(df.n,['تغيير','تغييران','تغييرات','تغييراً']):'✓ قُرئ الملف · لا تغييرات في البيانات';toast(msg);LOG.unshift({t:Date.now(),n:df.n,lines:df.lines.slice(0,8)});LOG=LOG.slice(0,12);if($('pop').classList.contains('on'))renderPop();}
  if(nd.warnings.length)console.warn('Excel warnings',nd.warnings);
  setTimeout(function(){CHANGED={};},2600);}
function readHandle(force){if(!LIVE.handle||LIVE.busy)return Promise.resolve();LIVE.busy=true;
  return LIVE.handle.getFile().then(function(f){if(!force&&f.lastModified===LIVE.last&&f.size===LIVE.size)return;return f.arrayBuffer().then(function(buf){var parsed;try{parsed=parseWorkbook(buf);}catch(err){throw {parse:true,msg:err.message||String(err)};}
      var annc=LIVE.last!=null||force;LIVE.last=f.lastModified;LIVE.size=f.size;applyParsed(parsed,{kind:'live',name:f.name,modified:f.lastModified},annc);});})
  .then(function(){LIVE.err=null;setLive('linked','مرتبط · مراقبة مباشرة','آخر قراءة '+fmtTime(Date.now())+' · '+(SRC.name||''));})
  .catch(function(err){if(err&&err.name==='NotAllowedError'){stopPoll();setLive('paused','المراقبة متوقفة','اضغطي «استئناف المراقبة» للسماح بقراءة الملف');}
    else if(err&&err.name==='NotFoundError'){setLive('error','تعذّر العثور على الملف','ربما نُقل أو أُعيدت تسميته · أعيدي ربطه');}
    else if(err&&err.parse){LIVE.err=err.msg;setLive('error','تعذّرت قراءة الملف','تُعرض آخر بيانات سليمة · '+err.msg);}
    else{setLive('linked','مرتبط · بانتظار الملف','الملف قيد الحفظ أو مقفل، ستُعاد المحاولة');}})
  .then(function(){LIVE.busy=false;});}
function startPoll(){stopPoll();LIVE.timer=setInterval(function(){if(!document.hidden)readHandle(false);},POLL_MS);}
function stopPoll(){if(LIVE.timer){clearInterval(LIVE.timer);LIVE.timer=null;}}
function useHandle(h){LIVE.handle=h;LIVE.last=null;LIVE.size=null;idbSet('handle',h);return readHandle(true).then(startPoll);}
function pickFile(){if(!FS_OK){$('file').click();return;}
  window.showOpenFilePicker({multiple:false,excludeAcceptAllOption:false,types:[{description:'ملف Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],'application/vnd.ms-excel.sheet.macroEnabled.12':['.xlsm']}}]})
  .then(function(hs){return useHandle(hs[0]);}).catch(function(err){if(err&&err.name!=='AbortError')toast('تعذّر فتح الملف: '+esc(err.message||err),true);});}
function resume(){if(!LIVE.handle){pickFile();return;}LIVE.handle.requestPermission({mode:'read'}).then(function(p){if(p==='granted'){readHandle(true).then(startPoll);}else toast('لم يُسمح بقراءة الملف',true);}).catch(function(){pickFile();});}
$('btn-link').addEventListener('click',function(){if(LIVE.state==='paused')resume();else pickFile();});
$('file').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;loadFileOnce(f);this.value='';});
function loadFileOnce(f){f.arrayBuffer().then(function(buf){var parsed=parseWorkbook(buf);applyParsed(parsed,{kind:'file',name:f.name,modified:f.lastModified},true);setLive('manual','قُرئ الملف مرة واحدة',FS_OK?'للمراقبة المباشرة استخدمي «ربط ملف Excel»':'المراقبة المباشرة تتطلب Chrome أو Edge · أعيدي الرفع بعد كل حفظ');}).catch(function(err){toast('تعذّرت قراءة الملف: '+esc(err.message||err),true);});}
window.addEventListener('focus',function(){if(LIVE.timer)readHandle(false);});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&LIVE.timer)readHandle(false);});
// drag & drop
var _dd=0;document.addEventListener('dragenter',function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>-1){_dd++;$('drop').classList.add('on');}});
document.addEventListener('dragleave',function(){_dd=Math.max(0,_dd-1);if(!_dd)$('drop').classList.remove('on');});
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){e.preventDefault();_dd=0;$('drop').classList.remove('on');var it=e.dataTransfer.items&&e.dataTransfer.items[0];
  if(it&&it.getAsFileSystemHandle){it.getAsFileSystemHandle().then(function(h){if(h&&h.kind==='file')useHandle(h);}).catch(function(){var f=e.dataTransfer.files[0];if(f)loadFileOnce(f);});}else{var f=e.dataTransfer.files[0];if(f)loadFileOnce(f);}});
// popover
function renderPop(){var h='<h4>ربط اللوحة بملف Excel</h4>';
  h+='<p>'+(FS_OK?'اختاري ملف «لوحة الاداء الاستراتيجية 2026» من مجلد OneDrive على جهازك. تقرأ اللوحة الملف كل ثانيتين، وتتحدث تلقائياً بعد كل حفظ في Excel مع إبراز ما تغيّر.':'هذا المتصفح لا يدعم المراقبة المباشرة للملفات. افتحي اللوحة في Google Chrome أو Microsoft Edge لتعمل المراقبة، أو ارفعي الملف يدوياً بعد كل حفظ.')+'</p>';
  h+='<p class="muted" style="font-size:12px">الملف لا يُرفع إلى أي مكان؛ يُقرأ داخل المتصفح فقط. تأكدي أن OneDrive يحتفظ بنسخة محلية من الملف (خيار «الاحتفاظ دائماً على هذا الجهاز») ليصل الحفظ إلى الجهاز مباشرة.</p>';
  h+='<div class="row"><button type="button" class="tbtn" data-pop="pick">'+(LIVE.handle?'تغيير الملف':'اختيار الملف')+'</button>'+(LIVE.handle?'<button type="button" class="tbtn" data-pop="now">قراءة الآن</button><button type="button" class="tbtn" data-pop="unlink">فك الربط</button>':'')+'<button type="button" class="tbtn" data-pop="once">رفع نسخة مرة واحدة</button><button type="button" class="tbtn" data-pop="embed">البيانات المضمّنة</button></div>';
  h+='<div class="muted" style="font-size:13px;margin-bottom:6px">المصدر الحالي: <b><bdi>'+esc(SRC.name||'—')+'</bdi></b>'+(SRC.modified?' · آخر حفظ '+fmtDT(SRC.modified):'')+'</div>';
  if(DATA&&DATA.warnings.length)h+='<div style="font-size:12px;color:var(--warn);margin-bottom:8px">تنبيهات القراءة: '+DATA.warnings.map(esc).join(' · ')+'</div>';
  h+='<div class="log"><b style="font-size:13px">سجل التحديثات</b>'+(LOG.length?LOG.map(function(l){return '<div><time class="num">'+fmtTime(l.t)+'</time>'+(l.n?nn(l.n,['تغيير','تغييران','تغييرات','تغييراً'])+(l.lines.length?'<br><span style="font-size:12px">'+l.lines.map(esc).join('<br>')+'</span>':''):'قراءة دون تغييرات')+'</div>';}).join(''):'<div>لا توجد تحديثات بعد.</div>')+'</div>';
  $('pop').innerHTML=h;}
function togglePop(on){var p=$('pop');if(on==null)on=!p.classList.contains('on');if(on){renderPop();p.classList.add('on');}else p.classList.remove('on');$('btn-livemenu').setAttribute('aria-expanded',String(on));}
$('btn-livemenu').addEventListener('click',function(e){e.stopPropagation();togglePop();});
document.addEventListener('click',function(e){if(!e.target.closest('#pop')&&!e.target.closest('#btn-livemenu'))togglePop(false);var b=e.target.closest('[data-pop]');if(!b)return;var a=b.getAttribute('data-pop');
  if(a==='pick')pickFile();else if(a==='now')readHandle(true);else if(a==='once')$('file').click();
  else if(a==='unlink'){stopPoll();LIVE.handle=null;idbDel('handle');setLive('embedded','غير مرتبط','تُعرض آخر بيانات قُرئت');renderPop();}
  else if(a==='embed'){stopPoll();LIVE.handle=null;idbDel('handle');loadEmbedded(true);renderPop();}});


/* ════════ visitor counter (published copy on GitHub Pages) ════════ */
var VIS_NS='alfaisalya-strategic-dashboard-2026',VIS_API='https://abacus.jasoncameron.dev/';
function visitorsInit(){var counting=/\.github\.io$/i.test(location.hostname),first=false;
  try{first=!localStorage.getItem('faisalya_seen_v1');if(first&&counting)localStorage.setItem('faisalya_seen_v1',String(Date.now()));}catch(e){first=false;}
  function call(key,hit){return fetch(VIS_API+(hit?'hit/':'get/')+VIS_NS+'/'+key,{cache:'no-store'}).then(function(r){if(r.status===404)return {value:0};if(!r.ok)throw new Error(r.status);return r.json();}).then(function(j){return +j.value||0;});}
  Promise.all([call('visitors',counting&&first),call('visits',counting)]).then(function(v){
    var u=$('v-u'),t=$('v-t');u.setAttribute('data-count',v[0]);t.setAttribute('data-count',v[1]);countUp($('visits'));
    $('visits').title='الزوار الفريدون: '+v[0]+' · مرات فتح اللوحة: '+v[1]+(counting?'':' (لا تُحتسب الزيارة عند فتح الملف من الجهاز)');
  }).catch(function(){$('visits').classList.add('off');$('visits').title='عدّاد الزوار غير متاح حالياً';});}
/* ════════ boot ════════ */
function b64ToBuf(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function loadEmbedded(ann){applyParsed(parseWorkbook(b64ToBuf(EMBED_XLSX)),{kind:'embedded',name:EMBED_NAME},ann);setLive('embedded','بيانات مضمّنة',FS_OK?'اربطي ملف Excel للمراقبة المباشرة':'المراقبة المباشرة تتطلب Chrome أو Edge');}
fit();renderTabs();visitorsInit();
if(typeof XLSX==='undefined'){$('screens').innerHTML='<div class="empty">تعذّر تحميل مكتبة قراءة Excel.</div>';}
else{loadEmbedded(false);
  if(FS_OK)idbGet('handle').then(function(h){if(!h)return;LIVE.handle=h;h.queryPermission({mode:'read'}).then(function(p){if(p==='granted'){readHandle(true).then(startPoll);}else setLive('paused','المراقبة متوقفة','الملف «'+h.name+'» مرتبط · اضغطي «استئناف المراقبة»');}).catch(function(){});});}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){placePill();placeInk();});
window.__dash={useHandle:useHandle,parseWorkbook:parseWorkbook,applyParsed:applyParsed,get DATA(){return DATA;},STATE:STATE};
})();
</script>
